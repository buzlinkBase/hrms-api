name: main-deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          # Pulls the content of your tenantstore submodule
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push hrms-api
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          target: hrms-service
          push: true
          tags: jhoncee2018/hrms-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push adms-api
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          target: adms-service
          push: true
          tags: jhoncee2018/hrms-adms-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- UPDATED: Build and push migration console app ---
      - name: Build and push migration-service
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          target: migration-service
          push: true
          tags: jhoncee2018/hrms-migration:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH into Droplet and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DIGITALOCEAN_DROPLET_IP }}
          username: ${{ secrets.DIGITALOCEAN_DROPLET_USERNAME }}
          key: ${{ secrets.DIGITALOCEAN_SSH_PRIVATE_KEY }}
          script: |
            # Navigate to your deployment folder
            cd hrms-api/
            echo "Updating images..."
            docker compose pull

            echo "Running database migrations..."
            # --- Injected Environment Configurations for .NET 9 App Settings ---
            SYSTEM_NAME="HRIS" \
            ConnectionStrings__TenantStoreConnection="${{ secrets.TENANT_DB_CONNECTION_STRING }}" \
            # RabbitMqSettings__Uri="${{ secrets.RABBITMQ_URI }}" \
            # Serilog__WriteTo__2__Args__serverUrl="${{ vars.SEQ_SERVER_URL }}" \
            # Serilog__WriteTo__2__Args__apiKey="${{ secrets.SEQ_API_KEY }}" \
            docker compose run --rm migration-service

            echo "Restarting services..."
            # --force-recreate ensures it uses the newly pulled image
            docker compose up -d --force-recreate

            echo "Cleaning up old images..."
            docker image prune -f
