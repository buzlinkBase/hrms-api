services: 
  hrms-api:
    build:
      context: .
      target: hrms-api
      dockerfile: Dockerfile
    image: jhoncee2018/hrms-api:latest
    container_name: hrms-api
    restart: always
    ports:
      - "8082:8080"
    networks:
      - hrmsnet
    env_file:
      - .env
  adms-api:
    build:
      context: .
      target: adms-api  
      dockerfile: Dockerfile
    image: jhoncee2018/hrms-adms-api:latest
    container_name: adms-api
    restart: always
    ports:
      - "8086:8080"
    networks:
      - hrmsnet
    env_file:
      - .env
 
networks:
  hrmsnet:
    driver: bridge
